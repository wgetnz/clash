name: Sync China IPv6 CIDR

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert china6.txt
        run: |
          curl -f -s --max-time 30 --retry 3 \
            "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt" \
            | grep -E "^[0-9a-fA-F:]+/[0-9]+" \
            | sort -u \
            | sed 's/^/IP-CIDR6,/' \
            > ipv6-cn-singbox.list
          echo "生成条数: $(wc -l < ipv6-cn-singbox.list)"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet ipv6-cn-singbox.list; then
            git add ipv6-cn-singbox.list
            git commit -m "chore(auto): sync ipv6-cn-singbox.list from gaoyifan/china-operator-ip"
            git push
          else
            echo "No changes"
          fi
